<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Explorer — Discover Every Country</title>
  <meta name="description" content="Explore countries, find detailed information, compare them, and save your favorites. Your journey around the world starts here.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon (inline SVG — extra request nahi) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
</head>
<body class="bg-[#f0f7f0] min-h-screen font-sans text-gray-800">

  <!-- ========== HEADER ========== -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">

        <!-- Logo -->
        <div class="flex items-center gap-3">
          <span class="text-3xl">🌍</span>
          <div>
            <h1 class="text-xl font-extrabold text-green-700 leading-tight">World Explorer</h1>
            <p class="text-[10px] text-gray-400 tracking-wide">Discover • Explore • Compare</p>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="hidden md:flex items-center gap-8">
          <a href="#explore" class="flex items-center gap-1.5 text-green-700 font-semibold text-sm border-b-2 border-green-600 pb-0.5">
             <span>Explore</span>
          </a>
          <a href="#favorites-section" class="flex items-center gap-1.5 text-gray-500 hover:text-green-600 text-sm font-medium transition">
             <span>Favorites</span>
          </a>
          <a href="#comparisonContainer" class="flex items-center gap-1.5 text-gray-500 hover:text-green-600 text-sm font-medium transition">
            <span>Compare</span>
          </a>
          <a href="#footer" class="flex items-center gap-1.5 text-gray-500 hover:text-green-600 text-sm font-medium transition">
             <span>About</span>
          </a>
        </nav>

        <!-- Right Side -->
        <div class="flex items-center gap-3">
          <!-- Mobile Menu Button -->
          <button
            id="mobileMenuBtn"
            type="button"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
            class="md:hidden p-1 text-xl text-gray-500 transition hover:text-green-600"
          >☰</button>
          <!-- Avatar -->
          <div class="w-9 h-9 bg-green-600 rounded-full flex items-center justify-center text-white font-bold text-sm">A</div>
        </div>
      </div>

      <!-- Mobile Nav (hidden by default) -->
      <nav id="mobileMenu" aria-label="Mobile navigation" class="hidden flex-col gap-3 border-t border-gray-100 pb-4 pt-3 md:hidden">
        <a href="#explore" class="text-green-700 font-semibold text-sm"> Explore</a>
        <a href="#favorites-section" class="text-gray-500 text-sm"> Favorites</a>
        <a href="#comparisonContainer" class="text-gray-500 text-sm"> Compare</a>
        <a href="#footer" class="text-gray-500 text-sm"> About</a>
      </nav>
    </div>
  </header>

  <script src="script.js"></script>
</body>
</html>
